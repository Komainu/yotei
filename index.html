<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Dispatch Replay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=IBM+Plex+Mono:wght@400;600&family=Press+Start+2P&display=swap">
</head>
<body>
<style>
/* =============================================================
   style.css — 見た目
   -------------------------------------------------------------
   色は :root の変数だけ触れば全部変わります。
   ============================================================= */
:root {
  --bg:        #e4e6ec;
  --surface:   #f6f7fa;
  --surface-2: #dcdfe8;
  --ink:       #14161e;
  --muted:     #59607a;
  --line:      #c3c7d4;
  --blue:      #1d5fc4;

  /* テレビの中は、部屋が明るくても暗いまま */
  --screen-bg:    #0a0b14;
  --screen-frame: #1b1f30;
  --screen-ink:   #edeff7;
  --screen-gold:  #fcbc3c;
  --screen-red:   #e8483a;
  --screen-green: #57d08a;
  --screen-muted: #8b93ad;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #0c0d14;
    --surface:   #141826;
    --surface-2: #1b2033;
    --ink:       #e7eaf4;
    --muted:     #939bb4;
    --line:      #272c3e;
    --blue:      #6fb0ff;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 12px 18px 12px;
  background: var(--bg);
  color: var(--ink);
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 1004px; margin: 0 auto; }
/* 横幅に余裕があるときは、この幅までなら「盤面の横に名簿」を許す。
   2026-09-04（task 4）: 操作欄を減らして縦に空いた余白を、盤面
   （主役）に回すため、名簿（脇役）の割り当てを少し狭め、その分
   盤面に使える横幅を広げた（横幅が伸びれば、縦横比の決まった盤面の
   高さも一緒に伸びる）。 */
@media (min-width: 1200px) { .wrap { max-width: 1320px; } }

.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
h1 {
  font-family: "Press Start 2P", monospace;
  font-size: clamp(.9rem, 3.4vw, 1.25rem);
  letter-spacing: .06em;
  margin: 0;
}

button, select, .file {
  font-family: "IBM Plex Mono", monospace;
  font-size: .82rem;
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--line);
  padding: 6px 10px;
  cursor: pointer;
}
button:hover, select:hover, .file:hover { border-color: var(--blue); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.ghost { background: transparent; }

/* ---- 言語切り替え（task E） ------------------------------------
   「見つけられなかった」という報告への対応。今までは行き先の言語名
   （EN/日本語）だけを1語出していて、それが何のボタンか伝わりにくかった。
   常に「日本語 / EN」の両方を出し、いま選ばれている方だけ濃くする＝
   押せば入れ替わることが見た目だけで伝わるようにする。 */
.lang-toggle {
  display: inline-flex; align-items: center; gap: 5px;
  font-weight: 700; padding: 7px 14px;
  border-width: 2px; border-color: var(--blue);
}
.lang-toggle:hover { background: var(--surface-2); }
.lang-toggle .lang-ja, .lang-toggle .lang-en { opacity: .4; transition: opacity .15s; }
.lang-toggle .lang-sep { opacity: .3; }
.lang-toggle[data-active="ja"] .lang-ja { opacity: 1; color: var(--blue); }
.lang-toggle[data-active="en"] .lang-en { opacity: 1; color: var(--blue); }

/* ---- テレビ ---- */
.bezel {
  background: var(--screen-frame);
  border: 2px solid #000;
  padding: 10px 12px 10px;
  box-shadow: 0 18px 40px rgb(0 0 0 / .28);
}

.hud {
  display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
  font-family: "Press Start 2P", monospace;
  font-size: .64rem; letter-spacing: .06em;
  color: var(--screen-muted);
  padding: 0 2px 7px;
}
.hud i { font-style: normal; }
.hud b { color: var(--screen-ink); font-weight: 400; }
.hud .g b { color: var(--screen-gold); }
.hud .right { margin-left: auto; color: var(--screen-muted); text-transform: none; }

canvas {
  display: block;
  /* width を vh 単位の値にして、height:auto でそこから縦横比どおりの
     高さを出す（＝ canvas の実ピクセル（480×320 だった頃）より大きく
     描画させる＝拡大表示するトリック）。
     ★ width:auto + max-width/max-height だけだと「縮小はするが
       拡大はしない」（置換要素の既定の振る舞い）ため、この用途には
       使えない。拡大させるには width 自体に具体的な値を持たせる必要が
       あるので、あえて vh 単位を使っている。 */
  width: min(1400px, 100%, 90vh);
  height: auto;
  image-rendering: pixelated;
  background: var(--screen-bg);
  margin: 0 auto;
}

/* 2026-09-04: 街・部屋を横に拡張してから、縦横比が別々になった
   （街 34:16≈2.13:1、部屋 20:8=2.5:1）。上の90vhは「両方に使える
   無難な値」でしかないので、実際にどちらを描いているかを
   render/stage.js が付ける data-stage 属性で見分けて、それぞれの
   比率にきちんと合わせた値を使う（＝同じ縦の予算でも、比率が横に
   広い部屋の方がより横幅を使えるようにする）。
   計算式: width の vh係数 = 使いたい高さの割合 × 縦横比。
   2026-09-04（task 4）: 操作欄を大きく減らして空いた縦の余白を、
   盤面（＝いちばん見てほしいもの）に足した。高さ予算52%・街2.125:1 → 111vh、
   高さ予算52%・部屋2.5:1 → 130vh（実際の上限はたいてい横幅
   （.wrap の最大幅・名簿の取り分）側で決まるので、ここは「それより
   小さい画面高でだけ効く」保険の意味合いが強い）。 */
#scene[data-stage="city"] { width: min(1400px, 100%, 111vh); }
#scene[data-stage="room"] { width: min(1400px, 100%, 130vh); }

/* 2026-09-13: 縦の狭い画面（1280×800 のノートなど）では、実況に
   ①〜⑤の帯が1行ぶん増えたぶんだけ全体がはみ出した（実測 27px）。
   縦の予算を絵から少しだけ返す＝はみ出しは操作欄や実況を削るのでは
   なく、いちばん融通のきく絵の高さで吸収する。1440×900 以上には
   一切効かない（そこは今までどおりの大きさ）。 */
/* ★ 2026-09-19: 実況の「誰が／どれを／何をした」を1行にまとめて
   実況欄が 250px → 102px に縮んだので、絵に返していた高さを戻す
   （「文字の枠が大きくなり過ぎて盤面が小さい」という報告への対応。
   数字は下の tools/worst 相当の実測で、はみ出し 0 になる上限）。 */
@media (max-height: 940px) {
  #scene[data-stage="city"] { width: min(1400px, 100%, 111vh); }
  #scene[data-stage="room"] { width: min(1400px, 100%, 112vh); }
}
/* 縦 860px 以下（1280×800 のノートなど）は、いちばん背の高いコマ
   （依頼が切り替わる注記が出るコマ）で 68px はみ出す（実測）。
   ここだけは詰める＝大きい画面の読みやすさは犠牲にしない。 */
@media (max-height: 860px) {
  #scene[data-stage="city"] { width: min(1400px, 100%, 100vh); }
  #scene[data-stage="room"] { width: min(1400px, 100%, 110vh); }
  .win { padding: 5px 12px; line-height: 1.35; }
  .win .jobtitle { font-size: 1.05rem; }
  .win .progress { font-size: .68rem; }
  .win .progress-note { font-size: .64rem; margin: 1px 0 0; }
  .hint { font-size: .72rem; margin: 2px 0 0; line-height: 1.4; }
  .side-note { font-size: .82rem; line-height: 1.6; padding: 8px 10px 9px; }
  .side-note b { font-size: .74rem; margin-bottom: 4px; }
  .raw { font-size: .78rem; padding: 3px 2px 0; }
  .win .progress-switch { margin: 2px 0 1px; padding: 2px 6px; }
  .controls { margin-top: 3px; }
}

/* 上＝物語 */
.win {
  background: var(--screen-bg);
  border: 3px solid var(--screen-ink);
  box-shadow: 0 0 0 3px var(--screen-bg), 0 0 0 5px #000;
  color: var(--screen-ink);
  padding: 10px 14px;
  margin-top: 6px;
  font-family: "DotGothic16", monospace;
  font-size: 1rem;
  line-height: 1.65;
  min-height: 3.2em;
}

/* 引用文と「詳細」ボタンを1行に並べる。.raw は min-height を持つので
   ボタンを右に置いても画面の高さは増えない（実測で確認した高さ配分を
   崩さないための置き方）。 */
.rawrow { display: flex; align-items: flex-start; gap: 8px; }
.rawrow .raw { flex: 1 1 auto; min-width: 0; }
.detail-btn {
  flex: 0 0 auto; margin-top: 6px; white-space: nowrap;
  font-size: .72rem; padding: 3px 10px; cursor: pointer;
  background: #223049; color: #e6f0ff; border: 1px solid #4b6fa8;
}
.detail-btn:hover { background: #2e4160; }

/* 下＝事実 */
.raw {
  font-size: .84rem; line-height: 1.7;
  color: var(--screen-muted);
  padding: 6px 2px 0;
  word-break: break-all;
  min-height: 2.6em;
}
.raw b   { color: var(--screen-green); font-weight: 400; }
.raw .err { color: var(--screen-red); }
.raw .dim { opacity: .7; }

/* ---- 操作 ---- */
.controls { margin-top: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row label { display: inline-flex; align-items: center; gap: 8px; }
.row label i { font-style: normal; font-size: .62rem; letter-spacing: .08em; color: var(--muted); }
.sep { width: 1px; height: 22px; background: var(--line); }
.beat { margin-left: auto; font-size: .74rem; color: var(--muted); }

.file { position: relative; overflow: hidden; display: inline-flex; }
.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

#scrub { width: 100%; margin-top: 8px; accent-color: var(--blue); }

/* このアプリで唯一の「読み方ヒント」行（旧・凡例＋2本のヒントを集約）。
   部屋の絵の読み方（板・台の比喩）と、街のクリック操作の説明を、
   どちらか関係あるほうだけ main.js が差し替える＝常に1行だけ。 */
.hint { font-size: .8rem; color: var(--muted); margin: 5px 0 0; line-height: 1.6; opacity: .95; }

/* 「詳しい設定」— サンプル・ログを開く・詳細・DIDで絞り込む・
   アドレスで読み込む、という「たまにしか使わない入口」をまとめて畳む。
   <details> は既定で閉じている＝JS 無しで開閉できる。 */
.advanced { margin-top: 8px; }
.advanced summary {
  cursor: pointer; font-size: .78rem; color: var(--muted);
  padding: 4px 2px; user-select: none;
}
.advanced summary:hover { color: var(--ink); }
.advanced > .row, .advanced > .hint { margin-top: 8px; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ライブ接続の行 */
.row.live { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
.row.live i { font-style: normal; font-size: .62rem; letter-spacing: .08em; color: var(--muted); }
#room {
  font-family: "IBM Plex Mono", monospace; font-size: .82rem;
  background: var(--surface); border: 2px solid var(--line); color: var(--ink);
  padding: 6px 10px; width: 130px;
}
#addr {
  font-family: "IBM Plex Mono", monospace; font-size: .82rem;
  background: var(--surface); border: 2px solid var(--line); color: var(--ink);
  padding: 6px 10px; width: 300px;
}
#live-status { font-size: .74rem; color: var(--muted); }

/* ---- エージェント一覧：1体1行、いま何をしているか -----------------
   実況は1コマ1行しか出せないので、7体が入り混じると誰も追えない。
   ここで1体1行にして、その人の最後の行動を残しておく。 */
.roster { margin: 10px 0 4px; padding: 8px 10px; background: #0d1119;
          border: 1px solid #232b3a; border-radius: 4px; }
.roster-chips { display: grid; gap: 2px; }
.roster .arow {
  display: grid;
  grid-template-columns: 18px 34px 62px minmax(8em, auto) 1fr 2.5em;
  align-items: center; gap: 8px;
  padding: 4px 6px; border-radius: 3px;
  font-size: 12px; line-height: 1.65; color: #cfe3ff;
  opacity: .6; transition: opacity .15s, background .15s;
}
.roster .arow.on { opacity: 1; background: #1b2434; }
.roster .arow .dot { width: 10px; height: 10px; border-radius: 2px; }
.roster .arow .num  { font-weight: 700; }
.roster .arow .tail { opacity: .65; font-family: ui-monospace, monospace; }
.roster .arow .doing { font-weight: 700; }
.roster .arow .what  { opacity: .6; font-family: ui-monospace, monospace;
                       overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.roster-note { margin: 7px 0 0; font-size: 10px; color: #8ea3c0; line-height: 1.5; }

/* ---- task 1: 選ぶまで何も動かない ----------------------------------
   読み込み直後・選んでいたエージェントの記録が尽きたときの両方で、
   「ここから選んでください」が一目で伝わるように、名簿そのものを
   光らせる。実況欄（.win）側の呼びかけ文言は下の .prompt-select /
   .prompt-ended。 */
.roster.awaiting {
  outline: 2px solid var(--screen-gold, #fcbc3c);
  outline-offset: 2px;
  animation: roster-pulse 1.8s ease-in-out infinite;
}
@keyframes roster-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(252, 188, 60, .4); }
  50%      { box-shadow: 0 0 0 7px rgba(252, 188, 60, 0); }
}
.win .prompt-select {
  font-size: 1.05rem; font-weight: 700; line-height: 1.6;
  color: var(--screen-gold);
}
/* 2026-09-08: 記録の終わりは実況を消さずに1行そえるだけにしたので、
   見出しと同じ大きさで出すと縦が伸びるだけ。小さく、控えめに。 */
.win p.prompt-ended {
  margin: 3px 0 0; font-size: .72rem; font-weight: 700; line-height: 1.4;
  color: var(--screen-gold);
}

/* LIVE 行は最初に押してほしいので目立たせる */
.row.live.primary { padding: 6px 8px; border: 1px solid #35507a;
  background: #101725; border-radius: 4px; }
.row.live.primary button.go { background: #2b5fa8; color: #eaf2ff;
  border-color: #4b7fc9; font-weight: 700; }
.row.live.primary button.go:hover { background: #3670c4; }
#livehelp { margin: 3px 0 5px; }

/* ---- 実況の見出し：誰が／依頼の題名／動詞 の3行 ------------------
   2026-09-06: 以前は「誰が・動詞（大）・どれを（小さいID/kindのおまけ）」
   という横並びで、画面でいちばん大きい文字が「仕事を掲示板に出した」の
   ような一般語で、実際の依頼の中身（≒答えるべき「何の仕事か」）が
   いちばん小さいグレー文字になっていた（ユーザー報告）。
   主語→依頼の題名（大きい）→動詞（大きい・下線）の3行に組み直し、
   目が最初に落ちる場所が「何の仕事か」になるようにする。 */
.win { display: flex; flex-direction: column; gap: 3px; }

/* 1行目：誰が（サムネイル・#番号・DIDの末尾・主語の助詞） */
.win .subject { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.win .thumb { width: 16px; height: 20px; image-rendering: pixelated; flex: 0 0 auto; }
.win .subject > i.dot { width: 14px; height: 14px; border-radius: 2px; flex: 0 0 auto; }
.win .who {
  border: 2px solid currentColor; border-radius: 3px;
  padding: 1px 8px; font-size: 1rem; font-weight: 700; line-height: 1.4;
}
.win .tail { font-family: ui-monospace, monospace; font-size: .8rem; opacity: .6; }
.win .particle { font-size: .95rem; opacity: .7; }

/* 2行目：依頼の題名（＝「何の仕事か」の答え）。見出しの主役なので
   動詞と同格の大きさにする。2行までは折り返して見せる（画面からあふれた
   ぶんは …、CSS 側でも2行を超えたら省略する二重の安全策）。 */
/* ★ 2026-09-19: 主語・目的語・動詞を1行に。以前は3つの block で
   縦に積んでいたため実況欄が高くなり、盤面が押し潰されていた。 */
.win .sayline {
  display: flex; align-items: baseline; flex-wrap: wrap;
  gap: 0 10px; row-gap: 0;
}
.win .sayline > * { margin: 0; }
.win .headline { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px; }
.win .jobtitle {
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
  overflow: hidden;
  font-size: 1.15rem; font-weight: 700; line-height: 1.3;
  color: var(--screen-ink);
}
/* 2026-09-14: 依頼の呼び名がギリシャ文字1字になったので、そのままだと
   すぐ横の「（仮）」と同じ大きさに見えて、どれが名前か分からない。
   名前だけ一回り大きく、注記は控えめにする。 */
.win .jobtitle { font-size: 1.4rem; letter-spacing: .02em; }
.win .jobtitle .prov { font-size: .5em; opacity: .5; }
.win .jobid { font-family: ui-monospace, monospace; font-size: .9rem; opacity: .85; }
.win .unknown { font-size: .78rem; opacity: .55; }

/* job の無い beat（街／x402）の「どれを」はこれまでどおり小さく。 */
.win .objline {
  font-size: .85rem; opacity: .82;
  font-family: ui-monospace, monospace; word-break: break-all;
}

/* 3行目：動詞。いちばん目立つ役目は題名に譲ったが、「何をしたか」も
   はっきり分かるよう大きく・下線つきのままにする。 */
.win .verb {
  font-size: 1.5rem; font-weight: 700; letter-spacing: .02em;
  text-decoration: underline; text-underline-offset: 3px;
  color: var(--screen-ink);
}

.win .say {
  font-size: .82rem; opacity: .72; line-height: 1.6;
  border-left: 2px solid currentColor; padding-left: 8px; margin-top: 2px;
}
/* 「その動詞が何を意味するか」を1行で。動詞より必ず控えめに。
   kibble も x402 も知らない人向けの説明なので、専門語は使わない。 */
.win .explain {
  font-size: .74rem; opacity: .58; line-height: 1.5;
  color: var(--screen-muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ---- 依頼の進み具合（task 3）：①出された › ②引き受けた › ③納品 › ④判定 ---- */
.win .progress {
  display: flex; flex-wrap: wrap; align-items: flex-start; gap: 2px 6px;
  font-size: .74rem; margin-top: 2px;
}
.win .progress .step { display: inline-flex; flex-direction: column; align-items: center; gap: 1px; }
.win .progress .step.pending { opacity: .5; }
.win .progress .step.done    { opacity: .85; }
/* まとめで「この子はこの段階をやらない」段階。薄くするだけだと
   「まだ来ていない」と見分けが付かないので、取り消し線で別物にする。 */
.win .progress .step.none      { opacity: .4; }
.win .progress .step.none .lab { text-decoration: line-through; text-decoration-thickness: 1px; }
.win .progress .step.current { opacity: 1; font-weight: 700; color: var(--screen-gold); }
.win .progress .now  { font-size: .58rem; font-weight: 400; color: var(--screen-gold); white-space: nowrap; }
.win .progress .arrow{ opacity: .4; align-self: center; }
.win .progress-caption { font-size: .64rem; opacity: .55; margin: 1px 0 0; }

/* task 3: この行がどの依頼の話か（キャプション）＋依頼が変わった注記。
   「①②③④が行ったり来たりする」という報告は、コマごとに主語（依頼）が
   違うことが伝わっていなかったのが原因。キャプションで主語を明示し、
   直前と依頼IDが変わった瞬間だけ、はっきり分かる注記とひと呼吸の
   ハイライトを添える。 */
.win .progress-head {
  display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px;
  font-size: .7rem; margin-top: 4px;
}
.win .progress-job { opacity: .7; font-family: ui-monospace, monospace; }

/* ★ 2026-09-07: 依頼が切り替わった瞬間の説明。1語の警告では
   「なぜ①に戻ったのか」が伝わらなかったので、前の依頼と今の依頼、
   そして理由（1体が複数の依頼を並行して進めている）まで書く箱にした。 */
.win .progress-switch {
  display: flex; flex-direction: column; gap: 1px;
  margin: 6px 0 2px; padding: 5px 7px;
  border: 1px solid rgba(252, 188, 60, .5);
  border-left-width: 3px; border-radius: 4px;
  background: rgba(252, 188, 60, .1);
  font-size: .68rem; line-height: 1.35;
}
.win .progress-switch b    { color: var(--screen-gold); font-size: .72rem; }
.win .progress-switch .pair{ font-family: ui-monospace, monospace; opacity: .85; }
.win .progress-switch .why { opacity: .7; }

/* ①がこのエージェントの記録に無いとき（別のエージェントが出した依頼）。
   「済み」と同じ見た目にすると、この子が出したと読めてしまうので、
   点線＋薄字で「ここには無い」ことを見た目でも示す。 */
.win .progress .step.elsewhere {
  opacity: .5; border-bottom: 1px dashed currentColor;
}
/* ①の在りかの注記と「灰色は…」を1行に並べる（狭い画面では折り返す）。 */
.win .progress-note {
  display: flex; flex-wrap: wrap; gap: 2px 10px;
  font-size: .74rem; margin: 3px 0 0; line-height: 1.55;
}
.win .progress-note .where { color: var(--screen-gold); opacity: .85; }
.win .progress-note .gray  { opacity: .7; }
.win .progress-note .role  { color: var(--screen-ink); opacity: .9; }
/* 詳細の「不明」。推測で埋めていないことが分かるように、値と同じ扱いで
   置くが色を落とす（空欄や「—」だと、抜けたのか不明なのか区別できない）。 */
.detail-body .dunknown { color: var(--screen-muted); font-style: italic; }
.win .progress.switched {
  border-radius: 4px;
  animation: progress-flash 1.1s ease-out;
}
@keyframes progress-flash {
  0%   { background: rgba(252, 188, 60, .35); }
  100% { background: rgba(252, 188, 60, 0); }
}

/* ---- 横に十分余裕があるとき：名簿を盤面の右側へ ------------------
   縦に並べると实況・生ログまでスクロールしないと見えないので、
   1200px 以上ではキャンバスの右に名簿を出し、縦の高さを浮かせる。
   DOM の順番は hud→canvas→win→raw→roster。
   ★ 狭い画面では DOM 順がそのまま表示順になる。実況（win）は
   このアプリで一番読ませたいものなので、名簿より前に置いてある。
   以前は名簿が先で、エージェントが200体いると実況が画面外まで
   押し下げられていた。 */
@media (min-width: 1200px) {
  .bezel {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(200px, 260px);
    grid-template-areas:
      "hud    hud"
      "canvas side"
      "win    win"
      "raw    raw";
    grid-template-rows: auto auto auto auto;
    column-gap: 18px;
    /* stretch にすると絵まで引き伸ばされてしまうので start のまま。
       代わりに名簿の高さに上限を置き、はみ出すぶんは名簿の中だけで
       スクロールさせる（絵より名簿が高いと1画面に収まらないため）。 */
    align-items: start;
  }
  .hud    { grid-area: hud; }
  canvas  { grid-area: canvas; }
  /* 右の列は「名簿」と「読み方」を縦に積んだ1つの項目。絵に2行を
     またがせる書き方は、またいだ高さの配り方がずれて画面が伸びる。

     ★ 2026-09-14: 名簿の高さ上限が min(46vh,460px) の「決め打ち」で、
     しかも同じ列に「読み方」の箱が増えたため、右の列が絵より背高に
     なって画面からはみ出していた（1920×1080・依頼40件で実測 179px。
     文字を大きくする前から 78px はみ出していた＝元からの不具合）。
     決め打ちをやめ、列そのものを行の高さ（＝絵の高さ）に合わせる。
     名簿は余ったぶんだけを使い、足りなければ中だけでスクロールする。 */
  .side-col {
    grid-area: side;
    display: flex; flex-direction: column; gap: 8px;
    min-height: 0;
    overflow: hidden;         /* 蓋（max-height）は main.js が絵の実寸から入れる */
  }
  .roster {
    margin: 0;
    flex: 0 1 auto;           /* 伸びない・足りなければ縮む */
    min-height: 0;
    max-height: none;
    overflow-y: auto;         /* 行が多いときはこの中だけスクロール */
  }
  .side-note { flex: 0 0 auto; }
  .win { grid-area: win; }
  /* .raw 自身はもうグリッド項目ではない（.rawrow の中に入った）ので、
     grid-area は .rawrow に付け替える。 */
  .rawrow { grid-area: raw; }
  .focus-stat { grid-column: 1 / -1; }
  /* 読み方の注意書き。一覧の下＝絵の高さぶん余っていた場所に置く
     （縦の間隔は .side-col の gap が持つ）。 */
  .side-note { margin: 0; }
}

/* 「x402ってなに？」。このアプリの目的そのものなので、見出しの隣で
   いちばん目につく色にしておく（押せることが読まなくても分かる）。 */
.intro-btn { margin-left: auto; margin-right: 8px; }

/* x402 の①〜⑤。依頼の①〜④とまったく同じ見た目で、行が長いので
   少しだけ字を詰める（5段階が1行に収まらないと道すじに見えない）。 */
.win .progress.x402 { font-size: .7rem; gap: 2px 5px; }

/* ★ 2026-09-14: ここは「x402ってなに？」への答えそのものなのに、
   画面でいちばん小さい文字（10.5px）だった。一覧の下には 330px の
   余白が空いていて、大きくしない理由が無い（実測）。 */
.side-note {
  margin: 8px 0 4px;
  padding: 11px 13px 12px;
  background: #0d1119;
  border: 1px solid #2b3547;
  border-left: 4px solid var(--screen-gold);
  border-radius: 4px;
  font-size: .92rem; line-height: 1.75;
  color: #e2ecff; opacity: 1;
}
.side-note b {
  display: block; margin-bottom: 6px;
  font-size: .82rem; letter-spacing: .04em; line-height: 1.4;
  color: var(--screen-gold); opacity: 1;
}

/* ---- エージェント一覧の行：クリックで1体に絞れる（task E）------- */
.roster .arow { cursor: pointer; }
.roster .arow.focused { opacity: 1; background: #2a2410; box-shadow: inset 0 0 0 1px #ffd35c; }
.roster .arow .thumb {
  width: 12px; height: 15px; image-rendering: pixelated;
  justify-self: center;
}

/* 1体だけに絞っている、という表示（task E）。件数は必ず正確に出す */
.focus-stat { color: var(--screen-gold, var(--muted)); font-weight: 700; }

/* 操作行：1体に絞る／すべて表示（task E） */
.row.focus input {
  font-family: "IBM Plex Mono", monospace; font-size: .78rem;
  background: var(--surface); border: 2px solid var(--line); color: var(--ink);
  padding: 5px 8px; min-width: 220px; flex: 1 1 220px;
}

/* LIVE の追いつき（task B） */
#live-skip { color: var(--muted); }

/* ---- 詳細パネル（task C） ------------------------------------------
   固定オーバーレイなので、閉じている（[hidden]）ときは通常の文書の
   高さに一切影響しない＝ scrollHeight <= innerHeight の制約はここでは
   常に保たれる。開いているときも fixed のまま＝下の1画面レイアウトを
   決して押し広げない。中身が多い（batch の中身など）ときはパネル内で
   だけスクロールする。 -------------------------------------------- */
/* ★ [hidden] は UA スタイルシートの display:none だが、同じ詳細度
   （0,1,0）のクラスセレクタはオーサー由来のぶん UA より優先されて
   しまい、display:flex がそのまま勝って隠れなくなる（Playwright で
   「閉じているはずのボタンが押せない＝実は覆いかぶさっている」事故を
   実際に検出した）。:not([hidden]) にして詳細度を上げ、hidden が付いて
   いる間は確実に display:none のままにする。 */
.detail-panel:not([hidden]) {
  position: fixed;
  right: 12px; bottom: 12px;
  width: min(560px, calc(100vw - 24px));
  max-height: min(72vh, 640px);
  background: var(--screen-frame);
  border: 2px solid #000;
  box-shadow: 0 12px 32px rgb(0 0 0 / .4);
  display: flex; flex-direction: column;
  z-index: 50;
  font-family: "IBM Plex Mono", monospace;
}
.detail-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; padding: 8px 10px;
  background: var(--screen-bg); color: var(--screen-ink);
  font-size: .78rem; font-weight: 700;
  border-bottom: 1px solid #000;
}
.detail-head button { padding: 3px 8px; font-size: .72rem; }
.detail-body {
  overflow-y: auto;
  padding: 6px 10px 10px;
  background: var(--surface);
}
.devent {
  border-bottom: 1px solid var(--line);
  padding: 6px 0;
}
.devent:last-child { border-bottom: none; }
.dhead { margin: 0 0 4px; font-size: .74rem; font-weight: 700; color: var(--blue); }
.dhead code { font-weight: 400; opacity: .8; }
.drow { display: flex; gap: 8px; font-size: .72rem; line-height: 1.5; }
.dlabel { flex: 0 0 8em; color: var(--muted); }
.dval { flex: 1 1 auto; word-break: break-all; }
.dempty { font-size: .8rem; color: var(--muted); }

/* 縦の詰め：1440×900 でもスクロールなしで全部見えるように。
   task 3（2026-09-04）でヒント行を1本に集約し、たまにしか使わない
   行（サンプル・ログを開く・DID絞り込み・アドレス）を「詳しい設定」
   （既定で閉じている <details>）へ畳んでから、詰める必要のある行数は
   大きく減った。ここに残っているのは、それでも 1440×900 では
   実測で足りない分だけの縮小（Playwright で確認して決めた値）。 */
@media (max-height: 940px) {
  .controls { margin-top: 4px; }
  #scrub { margin-top: 4px; }
  .hint { margin: 3px 0 0; line-height: 1.5; font-size: .78rem; }
  .row.live.primary { padding: 1px 8px; }
  .row { margin-bottom: 3px; }
  /* 2026-09-06: 実況の見出しが3行（主語／題名／動詞）＋進み具合の行に
     増えたぶん、1440×900 では詰めないと documentElement の
     scrollHeight が innerHeight を超える（実測）。見出しの一番大きい
     動詞・題名を少しだけ小さくし、行間・余白を削って収める
     （Playwright で確認して決めた値）。 */
  .win { padding: 6px 14px; margin-top: 4px; gap: 0; line-height: 1.42; }
  .win .jobtitle { font-size: 1.25rem; line-height: 1.25; }
  .win .verb { font-size: 1.25rem; }
  .win .progress { margin-top: 2px; font-size: .74rem; }
  .win .progress-caption { margin: 0; font-size: .68rem; }
  /* 2026-09-07: 依頼の切り替えの説明が出たコマだけ縦が伸びて、
     1440×900 で画面からはみ出していた（実測 +66px）。狭い画面では
     この箱を詰める。文言は削らない（削ると説明にならない）。 */
  .win .progress-switch {
    margin: 3px 0 1px; padding: 3px 6px; font-size: .63rem; line-height: 1.25;
    /* 狭い画面では「見出し」と「前→今」を同じ行に並べて2行に収める。
       理由の一文（.why）だけは必ず次の行へ（ここが本体なので折り返さない）。 */
    flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 0 8px;
  }
  .win .progress-switch b { font-size: .66rem; }
  .win .progress-switch .why { flex: 1 0 100%; }
  .win .progress-note { margin: 2px 0 0; font-size: .7rem; }
  .win .progress-head { margin-top: 2px; }
  /* 切り替えの箱が出たコマでも収まるように、めったに読まない周辺を詰める。
     盤面（canvas）だけは縮めない（「フィールドが小さすぎる」という報告が
     あった箇所なので、ここを削って辻褄を合わせるのは本末転倒）。 */
  .win .verb { font-size: 1.15rem; }
  .raw { padding: 4px 2px 0; }
  .controls .row { margin-bottom: 2px; }
  .advanced summary { padding: 1px; }
  .top { margin-bottom: 4px; }
  .top h1 { font-size: clamp(.85rem, 3vw, 1.05rem); }
  .top .ghost { padding: 3px 8px; font-size: .72rem; }
  .hud { padding: 0 2px 3px; }
  .hint { font-size: .78rem; }
  .win .explain { font-size: .7rem; }
  .win .say { margin-top: 0; font-size: .78rem; line-height: 1.4; }
  .raw { padding: 6px 2px 0; }
  /* 盤面（canvas）は縮めない。task 3 で操作欄を大きく削ったので、
     1440×900 でも #scene[data-stage=...] の基本値（102行付近）の
     ままで収まる（実測で確認済み）。 */
  /* 「詳しい設定」を開いたときも、狭い画面ではここで詰める
     （既定では閉じているので普段は影響しないが、開いたときに
     1440×900 でも収まりやすくしておく）。 */
  .row.focus { margin: 0; gap: 6px; }
  .row.focus button, .row.focus input { padding: 3px 8px; font-size: .74rem; }
  .advanced { margin-top: 4px; }
  .advanced summary { padding: 2px; }
  .advanced .row.live { margin-top: 3px; padding-top: 3px; }
  #livehelp { margin: 1px 0 3px; }
  #drophint { margin: 1px 0 0; }
  .roster { max-height: 31vh; }
}

/* 詳細パネルの「閉じる」が、暗い見出し帯の上で暗い文字になっていて
   読めなかった。見出し帯の中だけ明示的に色を指定する。 */
.detail-head button {
  background: #223049; color: #e6f0ff;
  border: 1px solid #4b6fa8;
}
.detail-head button:hover { background: #2e4160; }

/* 一覧の見出し・絞り込み欄。200体を超えると目で探すのは無理なので、
   ここが実質の入口になる。 */
.roster-top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  margin-bottom: 6px;
}
.roster-top b { font-size: 11px; color: #9db4d4; font-weight: 700; flex: 1 1 12em; }
#roster-filter {
  flex: 0 1 150px; min-width: 110px;
  padding: 3px 7px; font-size: 11px;
  background: #0a0d14; color: #cfe3ff;
  border: 1px solid #2b3a52; border-radius: 3px;
}
.roster-top button { font-size: 11px; padding: 3px 8px; }
.roster .arow[data-actor] { cursor: pointer; }
.roster .arow[data-actor]:hover { background: #1b2434; opacity: 1; }
.roster .arow.focused { outline: 1px solid #4b8fd8; opacity: 1; }
.roster .arow .cnt {
  font-size: 10px; opacity: .5; text-align: right;
  font-family: ui-monospace, monospace;
}
.roster .arow.more {
  grid-template-columns: 1fr; opacity: .55;
  font-size: 10px; padding-top: 6px;
}

/* 暗いパネルの上に置いたボタンは、.ghost の既定色（ほぼ黒）だと
   背景に沈んで「白い空箱」に見える。パネル内だけ明示的に指定する。 */
.roster-top button,
.detail-head button {
  background: #223049; color: #e6f0ff;
  border: 1px solid #4b6fa8; border-radius: 3px;
}
.roster-top button:hover,
.detail-head button:hover { background: #2e4160; }

/* エージェント一覧の「what」列（object() の出力）：仕事の題名を
   主語として立てる。ID だけだと何の話か分からない、という報告への対応。
   実況の見出し（.win）は 2026-09-06 で専用の .jobtitle/.jobid/.unknown に
   分けたので、ここは一覧の行にだけ効く。 */
.roster .arow .what .title { font-weight: 700; opacity: .95; }
.roster .arow .what .sub   { opacity: .55; font-size: .9em; }

/* まとめたコマの内訳。動詞のすぐ横に、控えめに。 */
.win .verb .brk { margin-left: 12px; font-size: .5em; font-weight: 400; opacity: .7;
                  letter-spacing: 0; vertical-align: middle; }

/* ---- 依頼一覧（2026-09-08）------------------------------------------
   追う対象がエージェント1体から依頼1件に変わったので、右の欄の中身も
   「依頼の行」になった。1行で「どこまで進んでいるか（①〜④の丸）」と
   「何の依頼か（題名）」が読めることを最優先にする。
   丸が塗られている＝その段階の記録がログの中にある、という意味だけ。
   灰色は予測ではなく「この取得範囲には無い」。 */
.roster-chips .jrow {
  display: block;
  padding: 5px 6px; border-bottom: 1px solid #232b3a;
  cursor: pointer; font-size: 12px; line-height: 1.65;
  /* 一覧の背景は暗い（.roster が #0d1119）。既定の文字色（--ink）は
     明るい画面用の濃い色なので、ここで必ず明るい色に上書きする
     ＝暗い背景に暗い文字、という一番くだらない読めなさを作らない。 */
  color: #cfe3ff;
}
.roster-chips .jrow:hover { background: #1b2434; }
.roster-chips .jrow.focused {
  background: rgba(252,188,60,.14);
  outline: 1px solid var(--screen-gold);
}
.roster-chips .jrow.more { cursor: default; opacity: .6; justify-content: center; }
.jdots { flex: 0 0 auto; letter-spacing: -1px; font-size: .8rem; }
.jdots .jd { font-style: normal; opacity: .28; }
.jdots .jd.has { opacity: 1; color: var(--screen-gold); }
.jrow .jkind {
  flex: 0 0 auto; font-size: 10px; padding: 0 4px;
  border: 1px solid #33405a; border-radius: 3px; opacity: .85; white-space: nowrap;
}
.jrow .jline1 { display: flex; align-items: center; gap: 6px; }
/* 行が押せることは、文章で説明するより印で示すほうが速い。 */
.jrow .gomark { flex: 0 0 auto; font-size: .62rem; color: var(--muted); opacity: .7; }
.roster-chips .jrow:hover .gomark,
.roster-chips .jrow.focused .gomark { color: var(--screen-gold); opacity: 1; }
.roster-chips .jrow.more .gomark { display: none; }
.jrow .jline2 { display: flex; align-items: baseline; gap: 6px; min-width: 0; margin-top: 1px; }
.jrow .jtitle {
  flex: 1 1 auto; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.jrow .jtitle.none { opacity: .6; font-family: ui-monospace, monospace; font-size: .68rem; }
.jrow .jstate { flex: 1 1 auto; font-size: 10px; opacity: .65; white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; }
.jrow .cnt { flex: 0 0 auto; font-size: 10px; opacity: .55; font-family: ui-monospace, monospace; }

/* 実況の下に出す「この依頼に出てくる面々」。 */
.win .castline { margin: 2px 0 0; font-size: .68rem; opacity: .8; }

@media (max-height: 940px) {
  .roster-chips .jrow { padding: 3px 6px; font-size: .7rem; }
  .win .castline { font-size: .62rem; margin: 1px 0 0; }
  .win p.prompt-ended { font-size: .66rem; margin: 1px 0 0; }
  .raw { min-height: 2.2em; }
}

/* ①〜④の各段階に添える「誰が」（2026-09-11）。段階の語のすぐ横に
   小さく出す＝どの段階を誰がやったかが、1行で読み切れるようにする。 */
.win .progress .step .lab { white-space: nowrap; }
.win .progress .pw { font-weight: 700; color: var(--screen-ink); }
.win .progress .pw.none { font-weight: 400; opacity: .7; }
.win .progress .step.current .pw { color: var(--screen-gold); }
.win .progress .pmore { margin-left: 2px; font-size: .85em; opacity: .6; }

/* ---- このアプリが付けた呼び名（2026-09-11）------------------------
   did:key の末尾6文字や k4147614196 では人は覚えられないので短い
   呼び名を出す。ただし本人が名乗った名前ではないので、（仮）を必ず
   小さく添える＝名前そのものと同じ強さで出さない。 */
.nick { font-weight: 700; }
.nick .prov { font-style: normal; font-weight: 400; font-size: .72em; opacity: .55; }
.win .subject .nick { color: var(--screen-ink); margin-left: 2px; }
.win .headline .job-nick { font-size: .8rem; margin-right: 6px; color: var(--screen-gold); }
.roster .arow .nick { font-weight: 400; opacity: .85; }
.jrow .job-nick { flex: 0 0 auto; font-size: 11px; color: var(--screen-gold); }
.jrow .job-nick .prov { display: none; }   /* 一覧では注記が下に出るので省く */

/* ---- 追い方の切り替え（2026-09-12）--------------------------------
   依頼から入る／エージェントから入る。どちらで見ても、最後に再生する
   のは「依頼1件」＝画面の作りは1本のまま（エージェントを選んだ場合は

<script>

/* =============================================================
   config.js — 調整値はすべてここ

   他のファイルに数値リテラルを散らかさないこと。

(function (AQ) {
  'use strict';

  AQ.config = {

    /* --- 1コマ（beat）の表示時間 [ms] ------------------------
       画面は「帯域の決まったチャンネル」。1秒あたりに出せるコマ数の
       上限がここで決まります。短くしすぎると読めなくなります。      */
    beatMs: {
      start:     2800,   // 起動して出発
      travel:    2400,   // 移動中
      require:   3000,   // 402 を出された
      pay:       2400,   // 支払った
      settle:    2800,   // オンチェーンで確定
      receive:   3000,   // 受け取った
      error:     3800,   // 応答なし（寄りの画面）
      batch:     3200,   // 支払いをまとめて記録
      actbatch:  3000,   // 支払いを含まない書き込みをまとめて記録（2026-09-03 追加）
      plan:      2800,   // 考えた／依頼を投稿した
      planbatch: 3200,   // 依頼の投稿が立て続けに来た（まとめて記録）
      idle:      2000,   // 無通信（待機）
      end:       3400
    },

    /* --- 再生速度の選択肢 ------------------------------------
       1コマは「1行読める長さ」が下限。ここを短くすると、
       速く流れるだけで何も伝わらない画面になります。            */
    speeds: [0.1, 0.25, 0.5, 1, 1.5, 2, 4],
    /* ★ 2026-09-12: 既定を 0.5× に。1× だと「札を持って運ぶ」場面が
       一瞬で終わって見えない（運ぶ動きはコマの70%を使う）。 */
    defaultSpeed: 0.5,
    /* LIVE 接続中は初見の人が追える速さまで自動で落とす。
       手で速度を変えたら、それを尊重してもう触らない。 */
    liveSpeed: 0.25,

    /* LIVE の再構築の間引き [ms]
       kibble は毎秒1〜2件届く。届くたびに組み直すとロボットの配置が
       毎回引き直されて画面がちらつくので、この間隔でまとめて処理する。 */
    liveRebuildMs: 1500,

    /* --- 集約のルール ----------------------------------------
       Tier2（承認など）が短時間に aggregateMin 件を超えたら、
       1コマの「つけ（batch）」にまとめます。
       少数のときはまとめずに1件ずつ描きます。                     */
    aggregateMin: 4,          // これ以上まとまっていたら集約する
    aggregateWindowMs: 4000,  // この幅に収まる連続イベントを1group扱い

    /* --- イベントの階層 --------------------------------------

       出来事ではない、という想定で Tier3（描かない）に置いていました。
       ですが kibble のような公開の依頼ボードでは、JOB の投稿は思考の
       独り言ではなく「実在の参加者が実在の仕事を board に置いた」という

       動いているはずの DID が画面から構造的に消えてしまい、
       このアプリの目的（動いている数だけロボットを見せる）と矛盾します。
       Tier2 に上げれば「少なければ1件ずつ描く／多ければ集約する」という
       既存の帯域の仕組みがそのまま働くので、依頼板が混んでいるときの
       コマ数の予算は今までどおり守られます。                         */
    tier: {
      'run.start':        1,
      'run.end':          1,
      'payment.settled':  1,
      'result.error':     1,
      'payment.required': 2,
      'payment.sent':     2,
      'result.ok':        2,
      'tool.call':        2,
      'agent.plan':       2,
      'cache.hit':        3,
      'poll':             3

    idleGapMs: 20000,

    palette: {

/* =============================================================
   sprites.js — 主役の絵（ベクター版）
   -------------------------------------------------------------
   主役は「自律配送ロボット」。現実にある宅配ロボットの姿です。
   （エージェント＝実体がなくて何をしているか見えない、という問題に
     わざと実体を与えている、というのがこの絵の意味です）

   ★ 2026-09-06: ドット絵（1文字=1ピクセルのグリッド）を廃止し、
     パス（角丸矩形・弧）で描くベクター図形に置き換えた。
     きっかけは「ドット絵が荒い」という繰り返しの報告 — 実は原因は
     絵そのものではなく低解像度キャンバスの拡大表示だった（render/*.js
     の解像度対応 task 参照）が、ユーザーは解像度対応とあわせて
     「滑らかな絵にしてほしい」を選んだ。ここではその選択に従い、
     ピクセルグリッドを完全に捨てて、パス描画に作り直す。

   ★ 変わらないもの（意味の継続）
     6つの特徴（アンテナ・頭部形状・車体プロポーション・走行部・
     背負い荷物・アクセサリ）が actor 文字列から決定的に選ばれ、
     見た目のシルエットを変える、という仕組み自体は変えていない。
     AQ.sprites.traitsFor(actor) は既存のテスト（tools/check-features.js
     など）が使っているので、そのまま残す。

   ★ 新しい公開API
     AQ.sprites.traitsFor(actor)   … 6つの特徴インデックス（0〜3）の配列（既存のまま）
     AQ.sprites.figureFor(actor)   … 上の配列を名前つきオブジェクトにしたもの
     AQ.sprites.drawFigure(ctx, fig, x, y, w, h, dir, palette)
       … (x,y) を左上とする w×h の箱の中にロボットを描く。dir は
         'down'（正面）/'up'（背面）/'left'/'right'（横向き）。
         palette は config.palette と同じキー（'1'〜'9','a'〜'g'）を
         持つオブジェクト（scene.js / room.js の paletteFor() が今までどおり
         actor ごとに '2'/'3' をティントしたものをそのまま渡せる＝
         呼び出し側の「actorごとに色を変える」しくみは変更不要）。
   ============================================================= */
(function (AQ) {
  'use strict';

  /* =============================================================
     0. actor → 特徴（決定的）。ここは以前とまったく同じ式のまま。
     ============================================================= */

  /* FNV-1a（32bit）＋ Murmur3 風の最終混ぜ。乗算ハッシュだけだと
     2のべき乗で mod したときの下位ビットが弱いので、最後にしっかり混ぜる。 */
  function hash32(str, salt) {
    var h = (0x811c9dc5 ^ salt) >>> 0;
    var s = String(str == null ? '' : str);
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;   // FNV prime（32bit）
    }
    h ^= h >>> 16;
    h = Math.imul(h, 0x85ebca6b) >>> 0;
    h ^= h >>> 13;
    h = Math.imul(h, 0xc2b2ae35) >>> 0;
    h ^= h >>> 16;
    return h >>> 0;
  }

  var TRAITS = ['antenna', 'head', 'body', 'tread', 'cargo', 'accent'];
  var VARIANTS = 4;   // 特徴1つあたりの選択肢（4^6 = 4096 通り）

  function pickVariant(actor, trait) {
    return hash32(actor, (TRAITS.indexOf(trait) + 1) * 2654435761) % VARIANTS;
  }

  /** テスト用・既存API: actor → 6つの特徴インデックス（0〜3）の配列。
      同じ actor なら常に同じ配列になる（純粋関数）。
      順序は TRAITS のとおり: antenna, head, body, tread, cargo, accent */
  AQ.sprites = AQ.sprites || {};
  AQ.sprites.traitsFor = function (actor) {
    var a = String(actor || 'agent');
    return TRAITS.map(function (tr) { return pickVariant(a, tr); });
  };

  /** actor → 描画パラメータ（名前つき）。traitsFor と中身は同じだが、
      呼び出し側（drawFigure・テスト）が番号の順序を覚えなくて済むように
      名前つきオブジェクトにしてある。純粋関数・決定的。 */
  AQ.sprites.figureFor = function (actor) {
    var t = AQ.sprites.traitsFor(actor);
    return { antenna: t[0], head: t[1], body: t[2], tread: t[3], cargo: t[4], accent: t[5] };
  };

  /* =============================================================
     1. 小さな描画部品
     ============================================================= */

  /** 角丸矩形のパスを ctx に積む（描画はしない。fill/stroke は呼び出し側）。
      古いブラウザでも動くよう ctx.roundRect() には頼らず自前で組み立てる。 */
  function roundRectPath(ctx, x, y, w, h, r) {
    if (w <= 0 || h <= 0) return;
    r = Math.max(0, Math.min(r == null ? Math.min(w, h) * 0.2 : r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function fillRound(ctx, x, y, w, h, r, color) {
    roundRectPath(ctx, x, y, w, h, r);
    ctx.fillStyle = color;
    ctx.fill();
  }

  function circle(ctx, cx, cy, r, color) {
    ctx.beginPath();
    ctx.arc(cx, cy, Math.max(0, r), 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  /* =============================================================
     2. 車体プロポーション（body。0〜3）。
        wf=幅（箱の幅に対する比）／top,bot=上端・下端（箱の高さに対する
        比）／r=角丸の強さ。 0=標準 1=細身 2=ワイド 3=縦長 */
  var BODY = [
    { wf: 0.58, top: 0.40, bot: 0.82, r: 0.16 },   // 標準
    { wf: 0.44, top: 0.40, bot: 0.82, r: 0.18 },   // 細身
    { wf: 0.76, top: 0.44, bot: 0.82, r: 0.13 },   // ワイド
    { wf: 0.50, top: 0.30, bot: 0.86, r: 0.11 }    // 縦長（背が高い）
  ];

  function bodyMetrics(x, y, w, h, variant) {
    var bv = BODY[variant] || BODY[0];
    var bw = w * bv.wf;
    var bx = x + (w - bw) / 2;
    var byTop = y + h * bv.top;
    var byBot = y + h * bv.bot;
    var bh = byBot - byTop;
    return { bx: bx, by: byTop, bw: bw, bh: bh, r: Math.min(bw, bh) * bv.r };

  function paintBody(ctx, body, pal) {
    var grad = ctx.createLinearGradient(body.bx, body.by, body.bx + body.bw, body.by + body.bh);
    grad.addColorStop(0, pal['2']);   // 明（actorごとにティントされた色）
    grad.addColorStop(1, pal['3']);   // 中（同じくティント）— 2段階のグラデーション

    ctx.fill();
    ctx.lineWidth = Math.max(1, body.bw * 0.035);
    ctx.strokeStyle = pal['1'];
    ctx.stroke();

    var pw = body.bw * 0.34, ph = body.bh * 0.20;

  /* =============================================================
     3. 頭部（head。0〜3）。 0=ドーム 1=箱型 2=箱型＋額のバー

    var headH = h * 0.24;

    roundRectPath(ctx, head.hx, head.hy, head.w, head.h, r);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.strokeStyle = pal['1'];

      ctx.fillRect(head.hx + head.w * 0.12, head.hy + head.h * 0.10, head.w * 0.76, barH);

      var er = head.h * 0.24;
      [head.hx, head.hx + head.w].forEach(function (ex) {

      case 1: {   // 大径2輪

        [body.bx + body.bw * 0.16, body.bx + body.bw * 0.84].forEach(function (wx) {
          circle(ctx, wx, baseY, r, pal['8']);
          circle(ctx, wx, baseY, r * 0.42, pal['9']);

        break;

      case 2: {   // 無限軌道（キャタピラ、全幅の帯）
        fillRound(ctx, body.bx, baseY - treadH * 0.2, body.bw, treadH, treadH * 0.3, pal['8']);
        ctx.strokeStyle = pal['1'];

        }

      }
      case 3: {   // 3輪（左右の小輪＋中央キャスター）
        var ww2 = body.bw * 0.18;
        [body.bx + body.bw * 0.02, body.bx + body.bw - ww2 - body.bw * 0.02].forEach(function (wx) {
          fillRound(ctx, wx, baseY - treadH * 0.2, ww2, treadH * 0.75, treadH * 0.25, pal['8']);
        });
        circle(ctx, x + w / 2, baseY + treadH * 0.35, treadH * 0.38, pal['9']);

      }
    }
  }

  /* =============================================================
     6. 背負い荷物（cargo。0〜3）。'down'（正面）以外は肩の後ろに
        フルに描き、'down' は肩口の留め具だけの控えめなヒントにする
        （既存デザインの継続：正面からでも違いがいくらか分かるように）。
     ============================================================= */
  function paintCargo(ctx, x, y, w, h, body, variant, facing, pal) {
    if (variant === 0) return;
    if (facing === 'down') {
      var col = (variant === 1) ? pal['9'] : (variant === 2 ? pal['7'] : pal['f']);
      ctx.fillStyle = col;
      ctx.fillRect(body.bx - w * 0.015, body.by + body.bh * 0.06, w * 0.05, body.bh * 0.2);
      ctx.fillRect(body.bx + body.bw - w * 0.035, body.by + body.bh * 0.06, w * 0.05, body.bh * 0.2);

    var cw = body.bw * 0.86, ch = body.bh * 0.46;
    var cx0 = x + w / 2 - cw / 2, cy0 = body.by - ch * 0.52;
    if (variant === 1) {   // 木箱（クレート）
      fillRound(ctx, cx0, cy0, cw, ch, ch * 0.1, pal['d']);
      ctx.strokeStyle = pal['1']; ctx.lineWidth = Math.max(1, w * 0.02); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx0, cy0 + ch / 2); ctx.lineTo(cx0 + cw, cy0 + ch / 2);
      ctx.strokeStyle = pal['9']; ctx.stroke();
    } else if (variant === 2) {   // ラック（枠＋中の小荷物2つ）
      ctx.strokeStyle = pal['9']; ctx.lineWidth = Math.max(1, w * 0.02);
      ctx.strokeRect(cx0, cy0, cw, ch);
      ctx.fillStyle = pal['7']; ctx.fillRect(cx0 + cw * 0.12, cy0 + ch * 0.25, cw * 0.32, ch * 0.5);
      ctx.fillStyle = pal['f']; ctx.fillRect(cx0 + cw * 0.56, cy0 + ch * 0.25, cw * 0.32, ch * 0.5);
    } else {   // タンク（丸い筒）
      fillRound(ctx, cx0 + cw * 0.16, cy0, cw * 0.68, ch, cw * 0.2, pal['d']);
      ctx.strokeStyle = pal['1']; ctx.lineWidth = Math.max(1, w * 0.02); ctx.stroke();
    }
  }

  /* =============================================================
     7. アクセサリ（accent。0〜3）。1点だけの飾り、車体の上に重ねる。
     ============================================================= */
  function paintAccent(ctx, x, y, w, h, body, variant, pal) {
    if (variant === 0) return;
    if (variant === 1) {   // ライトバー（肩の上端に光る帯）
      var lw = body.bw * 0.9, lh = body.bh * 0.07;
      fillRound(ctx, body.bx + body.bw * 0.05, body.by + body.bh * 0.02, lw, lh, lh * 0.5, pal['b']);
    } else if (variant === 2) {   // 小さな旗
      var px0 = body.bx + body.bw * 0.92, py0 = body.by - body.bh * 0.08;
      ctx.strokeStyle = pal['9']; ctx.lineWidth = Math.max(1, w * 0.02);
      ctx.beginPath(); ctx.moveTo(px0, py0); ctx.lineTo(px0, py0 + body.bh * 0.42); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(px0, py0); ctx.lineTo(px0 + body.bw * 0.18, py0 + body.bh * 0.09); ctx.lineTo(px0, py0 + body.bh * 0.18);
      ctx.closePath();
      ctx.fillStyle = pal['7']; ctx.fill();
    } else {   // デカール（胴体側面の色つきパネル）
      var dw = body.bw * 0.22, dh = body.bh * 0.34;
      fillRound(ctx, body.bx + body.bw * 0.12, body.by + body.bh * 0.30, dw, dh, dh * 0.2, pal['f']);
    }

  /* =============================================================
     8. 地面の影（ソフトシャドウ）
     ============================================================= */
  function paintShadow(ctx, x, y, w, h) {
    var cx = x + w * 0.5, cy = y + h * 0.96;
    var rx = w * 0.40, ry = h * 0.05;
    if (rx <= 0 || ry <= 0) return;
    var g;
    try { g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rx); }
    catch (e) { g = null; }
    if (g) {
      g.addColorStop(0, 'rgba(0,0,0,.32)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
    } else {
      ctx.fillStyle = 'rgba(0,0,0,.22)';
    }
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  /* =============================================================
     9. 組み立て（drawFigure）— 公開API
     ============================================================= */

  /** (x,y) を左上とする w×h の箱の中にロボットを描く。
      fig   … AQ.sprites.figureFor(actor) の戻り値（6特徴）
      dir   … 'down'|'up'|'left'|'right'（'left' は水平反転で描く）
      palette … config.palette と同じキー構成のオブジェクト（省略時は既定色）
      純粋な描画関数（状態を持たない）。同じ引数なら常に同じ絵になる。 */
  AQ.sprites.drawFigure = function (ctx, fig, x, y, w, h, dir, palette) {
    if (!ctx || !fig) return;
    var pal = palette || (AQ.config && AQ.config.palette) || {};
    var facing = (dir === 'up') ? 'up' : (dir === 'left' || dir === 'right') ? 'right' : 'down';

    ctx.save();
    if (dir === 'left') {
      ctx.translate(x + w, y);
      ctx.scale(-1, 1);
      x = 0; y = 0;
    }

    paintShadow(ctx, x, y, w, h);
    var body = bodyMetrics(x, y, w, h, fig.body);
    paintCargo(ctx, x, y, w, h, body, fig.cargo, facing, pal);
    paintTread(ctx, x, y, w, h, body, fig.tread, pal);
    paintBody(ctx, body, pal);
    var head = headMetrics(x, y, w, h, body);
    paintHead(ctx, head, fig.head, pal);
    paintFace(ctx, head, facing, pal);
    paintAntenna(ctx, head, fig.antenna, pal);
    paintAccent(ctx, x, y, w, h, body, fig.accent, pal);

    ctx.restore();
  };

         切り替えても呼び名が変わらない）。 */
      job: [
        'α','β','γ','δ','ε','ζ','η','θ','κ','λ',
        'μ','ν','ξ','π','ρ','σ','τ','υ','φ','χ','ψ','ω'
      ]
    }
  };

  /* IDが無い（null/undefined/空文字）ときのための、レジストリを
     消費しない固定の呼び名。空文字を返して「何も無い」ように
     見せない＝呼び名らしい体裁は保つ。 */
  var FALLBACK = { ja: 'なまえなし', en: 'Unnamed' };

  /** FNV-1a（32bit）。ID文字列 → ハッシュ値。単語選びだけに使う軽い
      ハッシュで十分（暗号用途ではない）。 */
  function hash(str) {
    var h = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = (h + (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24)) >>> 0; // ×16777619 を >>>0 で計算
    }
    return h >>> 0;
  }

  /* レジストリ本体。kind: 'actor' | 'job'、lang: 'ja' | 'en' の
     組み合わせごとに、以下を別々に持つ:
       byId     … id(文字列化) → すでに割り当てた呼び名
       baseUsed … 単語（数字を足す前の形）→ これまでに割り当てた回数
     エージェントと依頼は kind が違うので registry も分かれ、
     片方を呼んでももう片方の byId / baseUsed には触れない。 */
  function freshRegistry() {
    return {
      ja: { actor: { byId: {}, baseUsed: {} }, job: { byId: {}, baseUsed: {} } },
      en: { actor: { byId: {}, baseUsed: {} }, job: { byId: {}, baseUsed: {} } }
    };
  }
  var registry = freshRegistry();

  /* stats() 用に「実際にIDとして呼んだ回数」を kind ごとに数える
     （null/undefined/空文字は数えない＝そもそも登録していないため）。
     言語を跨いで同じIDを2回呼んでも、ここは「見た文字列IDの種類数」
     を数えたいので、言語非依存の集合を別に持つ。 */
  var seen = { actor: {}, job: {} };
  var seenCount = { actor: 0, job: 0 };

  function currentLang() {
    var i18n = AQ.i18n;
    return (i18n && i18n.lang === 'en') ? 'en' : 'ja';
  }

  function nicknameFor(kind, id) {
    if (id === null || id === undefined || id === '') {
      return FALLBACK[currentLang()];
    }
    var key = String(id);
    var lang = currentLang();
    var slot = registry[lang][kind];

    if (Object.prototype.hasOwnProperty.call(slot.byId, key)) {
      return slot.byId[key];
    }

    if (!Object.prototype.hasOwnProperty.call(seen[kind], key)) {
      seen[kind][key] = true;
      seenCount[kind]++;
    }

    var list = WORDS[lang][kind];
    var base = list[hash(key) % list.length];

    var count = slot.baseUsed[base] || 0; // これまで同じ単語に当たった回数
    var name = (count === 0) ? base : (base + (count + 1));
    slot.baseUsed[base] = count + 1;
    slot.byId[key] = name;
    return name;
  }

  AQ.nick = {

    /** エージェントIDに割り当てた短い呼び名（例: 'カワウソ' / 'Otter'）。
        本名ではない＝表示側は必ず「仮の呼び名」と分かる見せ方にすること。 */
    forActor: function (id) { return nicknameFor('actor', id); },

    /** 依頼IDに割り当てた短い呼び名（例: 'さくら' / 'Cedar'）。 */
    forJob: function (id) { return nicknameFor('job', id); },

    /** 新しいログを読み込んだときに呼ぶ。割り当てを全部忘れる
        （＝IDと呼び名の対応関係は保存しない。ログが変われば無意味
        になるものを持ち続けても、混乱の元にしかならないため）。 */
    reset: function () {
      registry = freshRegistry();
      seen = { actor: {}, job: {} };
      seenCount = { actor: 0, job: 0 };
    },

    /** ハーネス／デバッグ用: いくつのIDに呼び名を割り当て済みか。 */
    stats: function () {
      return { actors: seenCount.actor, jobs: seenCount.job };
    }
  };

     「知らないことを描く」のと同じ嘘になる。番号は「このアプリが
     表示のために振った」ものだと常に明示する（i18n の roster.disclaimer）。

   ★ 街と部屋で同じ番号になる
     どちらの画面も、この1か所から番号をもらう。beats（再生順）から
     初登場順に振るだけの純粋関数なので、同じログなら常に同じ番号になる。
   ============================================================= */
(function (AQ) {
  'use strict';

  /* 名前 → 決定的なハッシュ値。scene.js の車体色ぶんと全く同じ式を、
     こちらにも独立して持たせてある（お互いに読み込み順を気にしなくて済むように）。
     同じ actor 名なら、街のロボットも・部屋のロボットも・名簿のチップも
     必ず同じ色になる（式と表が両方とも一致しているため）。 */
  function hashStr(s) {
    var name = String(s || 'agent');
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return h;
  }

  var TINTS = [
    ['#ffd35c', '#d9a02c'],  // 黄
    ['#7fe6c4', '#3fae8a'],  // 緑
    ['#8fd0ff', '#4f96e0'],  // 青
    ['#ffa3c8', '#e0679e'],  // 桃
    ['#c6b3ff', '#8f74e0'],  // 紫
    ['#ffb27a', '#dd7d3f']   // 橙
  ];

  AQ.roster = {
    /** actor名 → スウォッチ色（明るい方の1色）。街のロボット車体・部屋の
        ロボット車体・名簿チップの色玉、すべてこの1つの式から。 */
    colorFor: function (actor) {
      return TINTS[hashStr(actor || 'agent') % TINTS.length][0];
    },
    /** beats（aggregate.js の再生順コマ列）→ { order, numberOf }
        order    … 初登場順の actor 名の配列
        numberOf … actor 名 → 番号（1始まり） */
    build: function (beats) {
      var order = [];
      var numberOf = {};
      (beats || []).forEach(function (b) {
        var actor = (b && b.actor) || 'agent';
        if (!Object.prototype.hasOwnProperty.call(numberOf, actor)) {
          numberOf[actor] = order.length + 1;
          order.push(actor);
        }
      });
      return { order: order, numberOf: numberOf };
    },

    /** 番号だけの表示文字列（ロボットの頭上用） */
    label: function (numberOf, actor) {
      var n = numberOf && numberOf[actor || 'agent'];
      return n ? ('#' + n) : '#?';
    }
  };

})(window.AQ = window.AQ || {});

/* ===== src/engine/questlog.js ===== */
/* =============================================================
   engine/questlog.js — Dispatch Log の読み込みと検証
   -------------------------------------------------------------
   入口はここ1か所。どのチェーンから来たデータでも、
   adapters/ で「Dispatch Log の配列」に直してから渡してください。
   ============================================================= */
(function (AQ) {
  'use strict';

  var TYPES = [
    'run.start', 'agent.plan', 'tool.call',
    'payment.required', 'payment.sent', 'payment.settled',
    'result.ok', 'result.error', 'run.end',
    'cache.hit', 'poll'
  ];

  /** 1件を正規化する。壊れていたら null を返す（落とさない） */
  function normalize(e, i) {
    if (!e || typeof e !== 'object') return null;
    var type = String(e.type || '');
    if (TYPES.indexOf(type) === -1) type = 'tool.call';   // 未知の種別は移動扱い
    return {
      i:      i,
      v:      e.v || 1,
      run:    e.run || 'run',
      t:      Number(e.t) || 0,
      actor:  e.actor || 'agent',
      type:   type,
      target: e.target || '',
      amount: e.amount || null,          // {asset,value,chain}
      tx:     e.tx || '',
      status: e.status || '',
      item:   e.item || '',
      say:    e.say || '',
      meta:   e.meta || {}
    };
  }

  AQ.questlog = {
    types: TYPES,

    /** 配列 or JSONL文字列 → 正規化済み配列（時刻順） */
    load: function (input) {
      var arr = [];
      if (typeof input === 'string') {
        input.split('\n').forEach(function (line) {
          line = line.trim();
          if (!line || line[0] === '/' || line[0] === '#') return;
          try { arr.push(JSON.parse(line)); } catch (err) { /* 壊れた行は無視 */ }
        });
      } else if (Array.isArray(input)) {
        arr = input.slice();
      }
      var out = [];
      arr.forEach(function (e, i) {
        var n = normalize(e, i);
        if (n) out.push(n);
      });
      out.sort(function (a, b) { return a.t - b.t; });
      return out;
    },

    /** 表示用の要約 */
    summary: function (events) {
      var spent = 0, paid = 0, failed = 0, actors = {};
      events.forEach(function (e) {
        if (e.type === 'payment.sent' && e.amount) { spent += Number(e.amount.value) || 0; paid++; }
        if (e.type === 'result.error') failed++;
        actors[e.actor] = true;
      });
      return {
        events:  events.length,
        spent:   spent,
        paid:    paid,
        failed:  failed,
        actors:  Object.keys(actors),
        run:     events.length ? events[0].run : '',
        startT:  events.length ? events[0].t : 0,
        endT:    events.length ? events[events.length - 1].t : 0
      };
    }
  };

})(window.AQ = window.AQ || {});

/* ===== src/engine/aggregate.js ===== */
/* =============================================================
   engine/aggregate.js — イベント列 → コマ（beat）列
   -------------------------------------------------------------
   「画面は帯域の決まったチャンネル」を実装している部分です。
     Tier1 … 必ず1コマ
     Tier2 … 少なければ1件1コマ、多ければ1コマにまとめる
     Tier3 … コマにしない（環境の密度としてだけ数える）
   ルールを変えたいときは config.js の tier / aggregate* を触る。
   ============================================================= */
(function (AQ) {
  'use strict';

  var KIND_OF = {
    'run.start':        'start',
    'run.end':          'end',
    'payment.required': 'require',   // 402 を出された
    'payment.sent':     'pay',       // 支払った
    'payment.settled':  'settle',    // オンチェーンで確定した
    'result.ok':        'receive',   // 受け取った
    'result.error':     'error',     // 応答なし
    'tool.call':        'travel',    // 向かっている
    'agent.plan':       'plan'       // 考えた／依頼を board に投稿した
  };

  function tierOf(type) {
    var t = AQ.config.tier[type];
    return t ? t : 2;
  }

  /* Tier2 の中でも「考えた／依頼を投稿した」(agent.plan) は、支払いや
     呼び出しとは別腹の会話だと考える。たまたま同じ数秒に payment.sent が
     3件・agent.plan が1件並んだだけで1つの「つけ」に混ぜてしまうと、
     依頼の投稿が金額の集計に紛れて消える（＝分からないことを描いてしまう）。
     なので、まとめる（pending）候補は同じ family どうしだけに限る。

     ★ 2026-09-03: 'wire' をさらに 'payment' と 'activity' に分けた（訂正）
       以前はここが agent.plan 以外すべて 'wire' という1つの family で、
       payment.sent / payment.required と、kibble の tool.call / result.ok が
       同じ「つけ」に混ざれた。kibble には payment.* が1件も無いのに、
       その束が flushPending() の「まとめて記録した」＝支払いの文言
       （「N authorizations · total 0.000」）で描かれてしまう、という
       実際に起きたバグの原因がここだった。kibble には払っていない金額を
       画面が「まとめて支払った」と報告していた＝分からないことを
       描いてしまっていた、最悪のクラスの嘘。
       payment.required / payment.sent だけを 'payment' family にし、
       それ以外（tool.call・result.ok など、今後増える非支払いの Tier2）は
       'activity' family にする。'payment' の束だけが金額の文言（batch）を
       持ち、'activity' の束は金額に一切触れない別の文言（actbatch）になる。 */
  function familyOf(type) {
    if (type === 'agent.plan') return 'plan';
    if (type === 'payment.required' || type === 'payment.sent') return 'payment';
    return 'activity';
  }

  /** ★ 2026-09-07: まとめる単位に「どの依頼か」を入れる。
      それまでは種別の family だけで束ねていたので、1つの
      「まとめて記録した」コマの中に別々の依頼のイベントが混ざり、
        ・見出しには代表イベント1件ぶんの題名しか出せない
          （＝残りの依頼の話が消える／急に別の依頼に変わったように見える）
        ・①〜④の進み具合が「どの依頼の話か」決められず消える
      という2つの症状になっていた（利用者からの報告）。
      依頼ごとに束ねれば、束は必ず1つの依頼の話になる。
      job を持たないイベント（街の x402 側など）は今までどおり
      family だけでまとまる。 */
  function groupKeyOf(e) {
    var m = e.meta || {};
    return familyOf(e.type) + '\u0000' + (m.job == null ? '' : m.job);
  }

  function beat(kind, events, extra) {
    var lead = events[events.length - 1] || null;   // 代表イベント（生ログ表示用）
    var b = {
      kind:   kind,
      events: events,
      lead:   lead,
      count:  events.length,
      actor:  (lead && lead.actor) || 'agent'        // このコマを動かしているエージェント
    };
    if (extra) Object.keys(extra).forEach(function (k) { b[k] = extra[k]; });
    return b;
  }

  AQ.aggregate = {

    /**
     * events → { beats, stats }
     * beats は再生順。stats.shown / stats.total を画面隅に出します。
     */
    toBeats: function (events) {
      var cfg = AQ.config;
      var beats = [];
      var pending = [];       // Tier2 の溜め
      var ambient = 0;        // Tier3 の件数（描かない）
      var lastT = null;
      var lastActor = null;   // 直前に動いていたエージェント（idle コマの持ち主にする）

      function flushPending() {
        if (!pending.length) return;
        if (pending.length >= cfg.aggregateMin) {
          // まとめて1コマ。pending は family＋依頼IDで分けて溜めているので、
          // ここに来る時点で中身は必ず同じ family かつ同じ依頼（下の push 側で
          // 保証）。family ごとに文言も別にする。
          var fam = familyOf(pending[0].type);
          if (fam === 'plan') {
            // agent.plan の束 ＝ 依頼の投稿。金額は無いので payment の「つけ」とは
            // 別の見せ方にする（合計 0 USDC と出すのは、無いものをあるように
            // 描くのと同じで嘘になる）。
            beats.push(beat('planbatch', pending.slice()));
          } else if (fam === 'payment') {
            // payment.required / payment.sent の束だけがここに来る。
            // 金額の合計は本物の payment.* から積んだものだけを足す。
            var total = 0, asset = '';
            pending.forEach(function (e) {
              if (e.amount) { total += Number(e.amount.value) || 0; asset = e.amount.asset || asset; }
            });
            beats.push(beat('batch', pending.slice(), { total: total, asset: asset }));
          } else {
            // 'activity'：payment.* を1件も含まない Tier2 の束（kibble の
            // tool.call / result.ok など）。何が起きたかを、実際にあった
            // イベント種別の内訳（byKind）で正直に持たせる。合計金額や
            // 「支払い」という言葉はここには一切出さない（hud.js 側）。
            var byKind = {};
            pending.forEach(function (e) {
              var k = KIND_OF[e.type] || e.type;
              byKind[k] = (byKind[k] || 0) + 1;
            });
            beats.push(beat('actbatch', pending.slice(), { byKind: byKind }));
          }
        } else {
          // 少数なので1件ずつ描く
          pending.forEach(function (e) {
            beats.push(beat(KIND_OF[e.type] || 'travel', [e]));
          });
        }
        pending = [];
      }

      function maybeIdle(e) {
        if (lastT === null) return;
        var gap = e.t - lastT;
        if (gap >= cfg.idleGapMs) {
          // 待機しているのは直前に動いていたエージェント。
          // どのロボットが充電スタンドにいるかを画面に正しく出すため。
          beats.push(beat('idle', [], { gapMs: gap, actor: lastActor || 'agent' }));
        }
      }

      events.forEach(function (e) {
        var tier = tierOf(e.type);

        if (tier === 3) { ambient++; return; }          // 描かない

        if (tier === 1) {
          flushPending();
          maybeIdle(e);
          beats.push(beat(KIND_OF[e.type] || 'travel', [e]));
          lastT = e.t;
          lastActor = e.actor;
          return;
        }

        // Tier2
        if (pending.length &&
            (groupKeyOf(pending[0]) !== groupKeyOf(e) ||
             (e.t - pending[0].t) > cfg.aggregateWindowMs)) {
          flushPending();
        }
        maybeIdle(e);
        pending.push(e);
        lastT = e.t;
        lastActor = e.actor;
      });

      flushPending();

      beats.forEach(function (b, i) { b.index = i; });

      return {
        beats: beats,
        stats: {
          shown:   beats.length,
          total:   events.length,
          ambient: ambient
        }
      };
    }
  };

})(window.AQ = window.AQ || {});

/* ===== src/engine/jobs.js ===== */
/* =============================================================
   engine/jobs.js — イベント列 → 依頼（job）ごとの索引
   -------------------------------------------------------------
   何をする場所か:
     Dispatch Log の中で meta.job を持つイベントだけを依頼ID別に
     束ね、①出された→②引き受けた→③納品→④判定 という kibble-v1 の
     書式が自然に持っている順序に沿って「代表イベント」を1件ずつ
     割り当てる。beat（コマ）化とは別腹＝aggregate.js には一切触れない。
     UI（board/dropoff/inspect など）がこの索引を土台にできるよう、
     ここでは描画都合の間引き（maxBoardCards 等）は一切しない。

   ★ 段階の当てはめは fromKibble.js が実際に出している形そのもの。
     ここで「CLAIM が無ければ後の行から推測する」といった穴埋めは
     しない（分からないことは描かない）。JOB 行が無い依頼（板の外で
     もらった依頼が CLAIM から始まる、など）は steps[1] が null の
     まま、known はその分だけ減って正直に出す。

   ★ title / kind の由来:
     fromKibble.js は CLAIM/DELIVER/ATTEST の行にも「そのとき既に
     JOB 行を見ていれば」titleByJob を引き継いで meta.title / meta.kind
     を載せる（2026-09-04 の修正）。つまり同じ依頼の複数の行に同じ
     題名が重複して乗っていることがほとんどだが、取得範囲の先頭が
     JOB 行より後ろだと、どの行にも乗っていないことがある。
     ここでは「①(JOB)行を最優先、無ければ他の行、どれにも無ければ
     null」という規則をそのまま素直に実装するだけで、それ以上の
     穴埋め（他の依頼から借りる、など）はしない。
   ============================================================= */
(function (AQ) {
  'use strict';

  /* イベント1件が①〜④のどれに当たるかを判定する。
     当てはまらない（type が違う、result.ok なのに verdict が
     useful でも空でもない、等）ときは 0 を返す＝rec.events には
     入れるが、どの段階の代表にも件数にも数えない。 */
  function classifyStep(e) {
    var m = e.meta || {};
    if (e.type === 'agent.plan') return 1;
    if (e.type === 'tool.call')  return 2;
    if (e.type === 'result.ok' && !m.verdict)          return 3;
    if (e.type === 'result.ok' && m.verdict === 'useful') return 4;
    if (e.type === 'result.error' && m.verdict === 'not') return 4;
    return 0;
  }

  /** 登場順・重複なしで actor を積む */
  function addUnique(arr, actor) {
    if (actor == null) return;
    if (arr.indexOf(actor) === -1) arr.push(actor);
  }

  /* 「①(JOB)行を最優先、無ければ他の行、どれにも無ければ null」を
     そのまま実装する。捏造しない＝空文字列や undefined は「無い」扱い。 */
  function deriveField(repEvent, eventsAsc, field) {
    if (repEvent) {
      var v0 = (repEvent.meta || {})[field];
      if (v0) return v0;
    }
    for (var i = 0; i < eventsAsc.length; i++) {
      var v = (eventsAsc[i].meta || {})[field];
      if (v) return v;
    }
    return null;
  }

  /** 同じ t のときは元の並び順を保つ（安定ソート）。
      Array#sort は ES2019 以降どの実装でも安定なので、比較関数を
      t の大小だけにすれば同値の相対順序は自然に保たれる。 */
  function byTAsc(a, b) { return a.t - b.t; }

  function buildRecord(id, rawEvents) {
    var events = rawEvents.slice().sort(byTAsc);

    var steps  = { 1: null, 2: null, 3: null, 4: null };
    var counts = { 1: 0, 2: 0, 3: 0, 4: 0 };
    var cast   = { poster: null, claimers: [], deliverers: [], judges: [] };

    events.forEach(function (e) {
      var step = classifyStep(e);
      if (!step) return; // どの段階にも当たらない＝件数にも代表にも数えない

      counts[step]++;
      if (!steps[step]) steps[step] = e; // その段階の「最初の1件」だけを代表にする

      if (step === 1)      { if (cast.poster === null) cast.poster = e.actor; }
      else if (step === 2) addUnique(cast.claimers, e.actor);
      else if (step === 3) addUnique(cast.deliverers, e.actor);
      else if (step === 4) addUnique(cast.judges, e.actor);
    });

    var known = 0;
    [1, 2, 3, 4].forEach(function (k) { if (steps[k]) known++; });

    var verdict = null;
    if (steps[4]) {
      var v = (steps[4].meta || {}).verdict;
      verdict = (v === 'useful') ? 'useful' : (v === 'not' ? 'not' : null);
    }

    return {
      id:      id,
      title:   deriveField(steps[1], events, 'title'),
      kind:    deriveField(steps[1], events, 'kind'),
      steps:   steps,
      counts:  counts,
      known:   known,
      cast:    cast,
      verdict: verdict,
      events:  events,
      firstT:  events.length ? events[0].t : null,
      lastT:   events.length ? events[events.length - 1].t : null
    };
  }

  /* known が多い依頼を先に、同数なら直近に動きがあった依頼を先に。
     どちらも同じなら id で決め切る（描画の並びが実行ごとに
     ぶれないようにするための最終タイブレーク）。 */
  function compareRecs(a, b) {
    if (b.known !== a.known) return b.known - a.known;
    if (b.lastT !== a.lastT) return b.lastT - a.lastT;
    if (a.id < b.id) return -1;
    if (a.id > b.id) return 1;
    return 0;
  }

  AQ.jobs = {

    /**
     * events（questlog.load 済みの Dispatch Log 配列）→
     *   { list: [rec,...], byId: { <jobId>: rec } }
     * meta.job を持たないイベントは依頼と無関係なので完全に無視する。
     */
    index: function (events) {
      var byId = {};
      var order = []; // 依頼ID の初出順（最終的な並びは compareRecs が決める）

      (events || []).forEach(function (e) {
        var m = e.meta || {};
        var jobId = m.job;
        if (jobId == null || jobId === '') return;
        if (!byId[jobId]) { byId[jobId] = []; order.push(jobId); }
        byId[jobId].push(e);
      });

      var list = order.map(function (id) { return buildRecord(id, byId[id]); });
      list.sort(compareRecs);

      var byIdOut = {};
      list.forEach(function (rec) { byIdOut[rec.id] = rec; });

      return { list: list, byId: byIdOut };
    },

    /** rec → 'judged' | 'delivered' | 'claimed' | 'posted' | 'unknown'
        判定・納品・引き受け・投稿のどこまで進んだかを、一番進んだ
        段階1つだけで表す（board/dropoff/inspect の置き場所の判断に使う想定）。*/
    stateOf: function (rec) {
      if (!rec) return 'unknown';
      if (rec.steps[4]) return 'judged';
      if (rec.steps[3]) return 'delivered';
      if (rec.steps[2]) return 'claimed';
      if (rec.steps[1]) return 'posted';
      return 'unknown';
    },

    /** rec → [actor,...]（poster→claimers→deliverers→judges の順、重複なし） */
    castOf: function (rec) {
      var out = [];
      if (!rec) return out;
      addUnique(out, rec.cast.poster);
      (rec.cast.claimers   || []).forEach(function (a) { addUnique(out, a); });
      (rec.cast.deliverers || []).forEach(function (a) { addUnique(out, a); });
      (rec.cast.judges     || []).forEach(function (a) { addUnique(out, a); });
      return out;
    }
  };

})(window.AQ = window.AQ || {});

/* ===== src/engine/state.js ===== */
/* =============================================================
   engine/state.js — その時点の残高などを計算する
   -------------------------------------------------------------
   すべて実在の単位です。
     usdc     … ウォレットの USDC 残高（サービスへの支払いに使う）
     credits  … 推論クレジットの残り（自分が考えるために使う）
     retries  … 残りの再試行回数（リトライ上限は実際の設定値）

   分からないことは描かない。
   `run.start` の meta に budget/credits/retries の宣言が無ければ、
   その初期値は「知らない」ものとして扱う（勝手に補わない）。
   hasBudget / hasCredits / hasRetries は、宣言があったときだけ true。
   宣言が無いフィールドの開始値は null のまま（fabricateしない）。

   コマ番号までのイベントを畳んで求めるので、巻き戻しても同じ値になります。

(function (AQ) {
  'use strict';

  /* 宣言が無いときの参考値（あくまでフォールバック定数。表示用ではない） */
  var START = {
    usdc:    5.000,
    credits: 100,
    retries: 3
  };

  AQ.state = {

    at: function (beats, upto) {
      var s = {
        usdc: null, credits: null, retries: null,
        hasBudget: false, hasCredits: false, hasRetries: false,
        spent: 0, paid: 0, failed: 0, ok: 0, settled: 0, actor: 'agent'
      };

      for (var i = 0; i <= upto && i < beats.length; i++) {
        beats[i].events.forEach(function (e) {
          if (e.actor) s.actor = e.actor;

          if (e.type === 'run.start' && e.meta) {
            if (e.meta.budget != null && !s.hasBudget) {
              s.hasBudget = true;
              s.usdc = Number(e.meta.budget);
            }
            if (e.meta.credits != null && !s.hasCredits) {
              s.hasCredits = true;
              s.credits = Number(e.meta.credits);
            }
            if (e.meta.retries != null && !s.hasRetries) {
              s.hasRetries = true;
              s.retries = Number(e.meta.retries);

          if (e.type === 'payment.sent' && e.amount) {
            var v = Number(e.amount.value) || 0;

          if (e.type === 'payment.settled') s.settled++;

          if (e.type === 'result.error') { s.failed++; if (s.hasRetries) s.retries--; if (s.hasCredits) s.credits -= 1; }
          if (e.type === 'tool.call')  { if (s.hasCredits) s.credits -= 1; }
          if (e.type === 'agent.plan') { if (s.hasCredits) s.credits -= 1; }

      }

      if (s.hasCredits && s.credits < 0) s.credits = 0;
      if (s.hasRetries && s.retries < 0) s.retries = 0;
      if (s.hasBudget  && s.usdc < 0)    s.usdc = 0;
      return s;

    start: START

/* ===== src/engine/clock.js ===== */
/* =============================================================
   engine/clock.js — 再生時計
   -------------------------------------------------------------
   コマを1つずつ進めるだけの小さな時計。
   ライブ表示（Phase1）にするときは、beats に後ろから足していけば
   この時計はそのまま使えます（だから中身に実時刻を持たせていない）。
   ============================================================= */
(function (AQ) {
  'use strict';

  AQ.Clock = function (opts) {
    var self = this;
    this.beats   = opts.beats || [];
    this.index   = 0;
    this.elapsed = 0;          // 現在のコマの経過 [ms]
    this.speed   = AQ.config.defaultSpeed;
    this.playing = false;
    this.onBeat  = opts.onBeat  || function () {};
    this.onFrame = opts.onFrame || function () {};
    this._last   = 0;
    this._raf    = null;

    this.durationOf = function (i) {
      var b = self.beats[i];
      if (!b) return 1000;
      return AQ.config.beatMs[b.kind] || 1200;
    };

    this.progress = function () {
      var d = self.durationOf(self.index);
      return d ? Math.min(1, self.elapsed / d) : 1;
    };

    this.setBeats = function (beats) {
      self.beats = beats || [];
      self.index = 0;
      self.elapsed = 0;
      self.onBeat(self.index);
    };

    this.seek = function (i) {
      self.index = Math.max(0, Math.min(self.beats.length - 1, i));
      self.elapsed = 0;
      self.onBeat(self.index);
      self.onFrame();          // 停止中でも必ず描き直す
    };

    this.step = function () {
      self.pause();
      self.seek(self.index + 1);
    };

    this.stepBack = function () {
      self.pause();
      self.seek(self.index - 1);
    };

    this.restart = function () { self.seek(0); self.play(); };

    this.play = function () {
      if (self.playing) return;
      self.playing = true;
      self._last = performance.now();
      loop(self._last);
    };

    this.pause = function () {
      self.playing = false;
      if (self._raf) cancelAnimationFrame(self._raf);
      self._raf = null;
    };

    this.toggle = function () { self.playing ? self.pause() : self.play(); };

    function loop(now) {
      if (!self.playing) return;
      var dt = (now - self._last) * self.speed;
      self._last = now;
      self.elapsed += dt;

      var d = self.durationOf(self.index);
      while (self.elapsed >= d) {
        self.elapsed -= d;
        if (self.index >= self.beats.length - 1) {
          self.elapsed = d;              // 最後のコマで止まる
          self.pause();
          self.onFrame();
          return;
        }
        self.index++;
        self.onBeat(self.index);
        d = self.durationOf(self.index);
      }
      self.onFrame();
      self._raf = requestAnimationFrame(loop);
    }
  };

})(window.AQ = window.AQ || {});

/* ===== src/engine/path.js ===== */
/* =============================================================
   engine/path.js — 目的地までの道すじ
   -------------------------------------------------------------
   歩けるのは歩道・横断歩道・敷地だけ。建物や設備の足元は通れません。
   歩道を優先して歩くように、マスごとに「歩きにくさ」を付けています。
   ============================================================= */
(function (AQ) {
  'use strict';

  function key(x, y) { return x + ',' + y; }

  var blocked = null;            // AQ.world（街）用のキャッシュ。既定の呼び出しはずっとこれだけを使う
  var otherBlocked = [];         // [{world, map}] 街以外の舞台（部屋など）用。数が少ないので配列で十分

  /** objects の足元を通行止めの集合にする */
  function buildBlockedFor(world) {
    var b = {};
    (world.objects || []).forEach(function (o) {
      for (var dy = 0; dy < o.h; dy++) {
        for (var dx = 0; dx < o.w; dx++) b[key(o.x + dx, o.y + dy)] = true;
      }
    });
    return b;
  }

  /* ★ world 引数について（後から追加した拡張。既存の呼び方は一切変えていない）
     もともとこのファイルは AQ.world（街）だけを見ていました。部屋（data/room.js）を
     足すにあたって「別の間取りでも経路探索できる」必要が出てきたので、
     canWalk / costAt / find の最後に世界（world）を省略可能な引数として足しました。
     省略すれば今までどおり AQ.world を見ます＝街側の呼び出し（scene.js）は
     1行も変えていません。部屋側（room.js）だけが第3引数に AQ.room を渡します。 */
  function worldOf(world) { return world || AQ.world; }

  function blockedFor(world) {
    if (!world || world === AQ.world) {
      if (!blocked) blocked = buildBlockedFor(AQ.world);
      return blocked;
    }
    for (var i = 0; i < otherBlocked.length; i++) {
      if (otherBlocked[i].world === world) return otherBlocked[i].map;
    }
    var m = buildBlockedFor(world);
    otherBlocked.push({ world: world, map: m });
    return m;
  }

  AQ.path = {

    /* 歩きにくさ。歩道を1にしてあるので、遠回りでも歩道を選びます */
    cost: { 's': 1, 'x': 1, 'p': 3 },

    reset: function () { blocked = null; otherBlocked = []; },

    canWalk: function (x, y, world) {
      world = worldOf(world);
      var b = blockedFor(world);
      var g = world.ground;
      if (y < 0 || y >= g.length) return false;
      var row = g[y];
      if (x < 0 || x >= row.length) return false;
      if (world.walkable.indexOf(row[x]) === -1) return false;
      return !b[key(x, y)];
    },

    costAt: function (x, y, world) {
      world = worldOf(world);
      var c = AQ.path.cost[world.ground[y][x]];
      return c == null ? 3 : c;
    },

    /** [x,y] から [x,y] までのマスの並び（出発点を含む・ダイクストラ）。
        world を省略すると街（AQ.world）。部屋の経路がほしいときは AQ.room を渡す。 */
    find: function (from, to, world) {
      world = worldOf(world);
      if (!from || !to) return [];
      if (from[0] === to[0] && from[1] === to[1]) return [from.slice()];

      var dist = {}, prev = {}, open = [from.slice()];
      dist[key(from[0], from[1])] = 0;
      var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];

      while (open.length) {
        var bi = 0;
        for (var i = 1; i < open.length; i++) {
          if (dist[key(open[i][0], open[i][1])] < dist[key(open[bi][0], open[bi][1])]) bi = i;
        }
        var cur = open.splice(bi, 1)[0];
        if (cur[0] === to[0] && cur[1] === to[1]) break;

        for (var d = 0; d < dirs.length; d++) {
          var nx = cur[0] + dirs[d][0], ny = cur[1] + dirs[d][1];
          if (!AQ.path.canWalk(nx, ny, world)) continue;
          var k = key(nx, ny);
          var nd = dist[key(cur[0], cur[1])] + AQ.path.costAt(nx, ny, world);
          if (dist[k] == null || nd < dist[k]) { dist[k] = nd; prev[k] = cur; open.push([nx, ny]); }
        }
      }

      if (dist[key(to[0], to[1])] == null) return [from.slice()];

      var route = [], node = to;
      while (node) { route.unshift(node); node = prev[key(node[0], node[1])]; }
      return route;
    },

    /** 経路上の位置。dir は向き */
    posOn: function (route, p) {
      if (!route.length) return { x: 0, y: 0, dir: 'down' };
      if (route.length === 1) return { x: route[0][0], y: route[0][1], dir: 'down' };

      var segs = route.length - 1;
      var f = Math.max(0, Math.min(1, p)) * segs;
      var i = Math.min(segs - 1, Math.floor(f));
      var t = f - i;
      var a = route[i], b = route[i + 1];

      var dir = 'down';
      if (b[0] > a[0]) dir = 'right';
      else if (b[0] < a[0]) dir = 'left';
      else if (b[1] < a[1]) dir = 'up';

      return { x: a[0] + (b[0] - a[0]) * t, y: a[1] + (b[1] - a[1]) * t, dir: dir };
    }
  };

})(window.AQ = window.AQ || {});

/* ===== src/engine/live.js ===== */
/* =============================================================
   engine/live.js — ライブ表示（Phase 1 の中身）
   -------------------------------------------------------------
   設計の約束どおり、レンダラは最後までリプレイ専用のままです。
   ここがやるのは「新着イベントをコマ列の後ろに足す」ことだけ。

   technocore.chat の長ポーリングを使います:
     GET /r/<room>?format=json&since=<seq>&wait=10
   10秒待って新着があれば返る。無ければ空で返るので、
   これを繰り返すだけで実質のライブになります。
   読みは 120回/分まで（＝2回/秒）。10秒待ちなら余裕で収まります。

   ★ 部屋の書式は接続してみるまで分からない
     技術的には「同じ technocore.chat の、部屋名が違うだけ」なので、
     生のメッセージを取ってきたあとで adapters/detect.js と同じ判定
     （looksLikeKibble）にかけ、kibble 書式が多ければ fromKibble、
     そうでなければ fromTechnocore に流します。ロング・ポーリング自体の
     タイミングやリトライは一切変えていません。
   ============================================================= */
(function (AQ) {
  'use strict';

  AQ.live = {
    room: null,
    since: 0,
    running: false,
    onEvents: null,      // function(events) { ... }
    onStatus: null,      // function(text) { ... }
    _timer: null,
    _fromEvents: null,   // 接続後に決まる: fromTechnocore か fromKibble

    /** 生のメッセージ配列を見て、どちらの adapter で翻訳するか選ぶ。
        一度決めたら、その部屋につないでいる間は変えない。 */
    _pickAdapter: function (msgs) {
      return (AQ.adapters.looksLikeKibble && AQ.adapters.looksLikeKibble(msgs))
        ? AQ.adapters.fromKibble
        : AQ.adapters.fromTechnocore;
    },

    /** 直近メッセージだけを取る（変換前・adapter を選ぶ前に使う） */
    _fetchRaw: function (room, limit) {
      var url = AQ.adapters.technocoreBase + '/r/' + encodeURIComponent(room) +
                '?format=json&limit=' + limit;
      return fetch(url, { mode: 'cors' }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function (json) {
        return Array.isArray(json) ? json : (json.messages || []);
      });
    },

    /** 開始。まず直近を取ってから、以後は新着だけを追いかけます */
    start: function (room, onEvents, onStatus) {
      var self = this;
      self.stop();
      self.room = room;
      self.since = 0;
      self.running = true;
      self.onEvents = onEvents || function () {};
      self.onStatus = onStatus || function () {};
      self._fromEvents = null;

      self.onStatus('connecting…');
      self._fetchRaw(room, 40).then(function (msgs) {
        if (!self.running) return;
        self._fromEvents = self._pickAdapter(msgs);
        msgs.forEach(function (m) {
          if (m.seq != null && m.seq > self.since) self.since = m.seq;
        });
        self.onEvents(self._fromEvents(msgs, { room: room, observedAt: Date.now() }));
        self.onStatus('LIVE · ' + room + ' · seq ' + self.since);
        self._poll();
      }).catch(function (e) {
        self.running = false;
        self.onStatus('failed: ' + e.message);
      });
    },

    stop: function () {
      this.running = false;
      if (this._timer) { clearTimeout(this._timer); this._timer = null; }
    },

    _poll: function () {
      var self = this;
      if (!self.running) return;
      var url = AQ.adapters.technocoreBase + '/r/' + encodeURIComponent(self.room) +
                '?format=json&since=' + self.since + '&wait=10';

      fetch(url, { mode: 'cors' })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (json) {
          if (!self.running) return;
          var msgs = Array.isArray(json) ? json : (json.messages || []);
          if (msgs.length) {
            if (!self._fromEvents) self._fromEvents = self._pickAdapter(msgs);
            msgs.forEach(function (m) {
              if (m.seq != null && m.seq > self.since) self.since = m.seq;
            });
            // 新着は「今」観測したもの。推定の間隔は詰める。
            var ev = self._fromEvents(msgs, {
              room: self.room, observedAt: Date.now(), spacingMs: 400
            }).filter(function (e) {
              return e.type !== 'run.start' && e.type !== 'run.end';
            });
            self.onEvents(ev);
          }
          self.onStatus('LIVE · ' + self.room + ' · seq ' + self.since);
          self._timer = setTimeout(function () { self._poll(); }, 500);
        })
        .catch(function (e) {
          self.onStatus('retrying… (' + e.message + ')');
          self._timer = setTimeout(function () { self._poll(); }, 4000);
        });
    }
  };

})(window.AQ = window.AQ || {});

/* ===== src/render/tiles.js ===== */
/* =============================================================
   render/tiles.js — 地面1マスの絵（20px）
   -------------------------------------------------------------
   現代の市街地の路面だけを描きます。建物や設備は props.js。

   質を上げるための決まりごと:
     ・光は左上から。右下ほど暗くする
     ・1つの素材につき明・中・暗の3色以上を使う
     ・同じマスは毎回同じ模様（noise() を使う。乱数は使わない）
   ============================================================= */
(function (AQ) {
  'use strict';

  var T = 20;

  var COL = {
    /* 車道 */
    road:    '#3b3e48',
    roadHi:  '#464a56',
    roadLo:  '#32353e',
    line:    '#d8d3bd',      // センターライン（黄白）
    zebra:   '#e8e9ee',

    /* 歩道 */
    walk:    '#b3b7c2',
    walkHi:  '#c2c6d0',
    walkLo:  '#9ca1ad',
    joint:   '#8f95a2',
    curb:    '#8b909d',
    curbHi:  '#cfd3db',

    /* 敷地 */
    plaza:   '#9aa0ad',
    plazaHi: '#a8aeba',
    plazaLo: '#878d9a',

    /* 植え込み */
    green:   '#3c6b3f',
    greenHi: '#4c8150',
    greenLo: '#2e5432'
  };

  var ctx;
  function px(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, w, h); }

  function speckle(x, y, cx, cy, color, count) {
    for (var i = 0; i < count; i++) {

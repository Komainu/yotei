<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 予定管理のアイコン: 手帳 (左に綴じ輪) と、ページに描いた小さな家 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#38d9c0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 262) rotate(-4) translate(-256 -262)">
    <!-- 手帳 -->
    <rect x="142" y="112" width="250" height="300" rx="26" fill="#2f3a56" opacity=".22" transform="translate(10 12)"/>
    <rect x="142" y="112" width="250" height="300" rx="26" fill="#fffaf0"/>
    <rect x="142" y="112" width="44" height="300" rx="22" fill="#f1e6cf"/>
    <!-- 罫線 -->
    <g stroke="#e3d5b8" stroke-width="6" stroke-linecap="round">
      <line x1="210" y1="352" x2="362" y2="352"/>
      <line x1="210" y1="380" x2="320" y2="380"/>
    </g>
    <!-- 小さな家 -->
    <path d="M216 236 L283 176 L350 236" fill="none" stroke="#3c3f45" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M232 226 V318 H334 V226" fill="#ffd27a" stroke="#3c3f45" stroke-width="12" stroke-linejoin="round"/>
    <rect x="264" y="266" width="30" height="52" rx="5" fill="#ff7a6b" stroke="#3c3f45" stroke-width="9"/>
    <rect x="306" y="248" width="18" height="18" rx="3" fill="#7cc6ff" stroke="#3c3f45" stroke-width="6"/>
    <!-- しおり -->
    <path d="M352 112 V170 L366 158 L380 170 V112 Z" fill="#ff7ab8"/>
    <!-- 綴じ輪 -->
    <g fill="#ffffff" stroke="#3c3f45" stroke-width="7">
      <circle cx="164" cy="160" r="12"/>
      <circle cx="164" cy="230" r="12"/>
      <circle cx="164" cy="300" r="12"/>
      <circle cx="164" cy="370" r="12"/>
    </g>
  </g>
</svg>
